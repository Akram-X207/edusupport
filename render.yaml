services:
  # Python FastAPI Backend Web Service
  - type: web
    name: edusupport-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ALLOWED_ORIGINS
        value: "*"
